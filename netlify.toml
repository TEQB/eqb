[build]
  command = "next build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_UNIVERSITY_EMAIL_DOMAIN,ADMIN_SECRET_PATH,GEMINI_MODEL"

# ── Security headers for all routes ──
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://qcxmyqdmqenrynehdeci.supabase.co; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' https://qcxmyqdmqenrynehdeci.supabase.co https://api.resend.com https://api.brevo.com; frame-src https://vercel.live; object-src 'none'; base-uri 'self'; form-action 'self'"

# ── Cache static assets ──
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/storage/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirect HTTP → HTTPS ──
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true
